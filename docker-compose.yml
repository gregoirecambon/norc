services:
  server:
    build:
      context: ./server
    env_file:
      - path: .env
        required: false
    # Loopback-only: nginx (the ui service) is the single public entrypoint.
    # Everything — dashboard, agents, OAuth callbacks, Notion webhooks — goes
    # through port 3000 / your reverse proxy at NORC_PUBLIC_URL.
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    volumes:
      - norc-data:/data
    environment:
      PORT: 3001
      DATABASE_PATH: /data/norc.db
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
    environment:
      NORC_API_URL: http://server:3001

volumes:
  norc-data:
