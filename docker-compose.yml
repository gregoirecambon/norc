services:
  server:
    build:
      context: ./server
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - norc-data:/data
    environment:
      PORT: 3001
      DATABASE_PATH: /data/norc.db
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
    environment:
      NEXUS_API_URL: http://server:3001

volumes:
  norc-data:
